# The original open-source `peripheryapp/periphery` went commercial and
# archived on 2026-08-12 — the "index store path does not exist" failure
# this project hit earlier was that tool being incompatible with this
# machine's Xcode 27 Beta build layout, not a config mistake here. The
# successor, `periphery-cli` (periphery-pro/tap, free tier for open-source/
# indie/hobby projects, no account needed for the public scan workflow),
# works against this project out of the box — no `targets:` key any more,
# it scans every SwiftPM target automatically.
retain_public: true
retain_objc_accessible: true
retain_unused_protocol_func_params: true
disable_update_check: true
