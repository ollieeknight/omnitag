# Generated project — never edit OmniTag.xcodeproj by hand, it is disposable.
# SwiftPM (Package.swift) stays the source of truth for modules and tests;
# this file only adds the app-bundle wrapper Xcode needs for ⌘R and Previews.
name: OmniTag
options:
  bundleIdPrefix: com.oliverknight
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  OmniTag:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OmniTag:
    type: application
    platform: macOS
    sources:
      - path: Sources/OmniTagApp
    dependencies:
      - package: OmniTag
        product: MediaCore
      - package: OmniTag
        product: TagIO
      - package: OmniTag
        product: LibraryIndex
      - package: OmniTag
        product: EditEngine
      - package: OmniTag
        product: MetadataAPI
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.oliverknight.omnitag
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - package: OmniTag/MediaCoreTests
        - package: OmniTag/TagIOTests
        - package: OmniTag/EditEngineTests
      gatherCoverageData: true
      environmentVariables:
        # Point this at your own media to run the real-file assertions in Xcode.
        OMNITAG_REAL_MEDIA:
          value: ""
          isEnabled: false
